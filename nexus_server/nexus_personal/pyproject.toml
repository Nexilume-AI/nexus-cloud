# Copied to a clean build directory by the reviewed Community release pipeline.
# Never run package discovery over the mixed Enterprise repository.
[build-system]
requires = ["setuptools>=83,<84", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-community-server"
version = "0.0.0.dev0"
description = "Single-owner Nexus Community host"
requires-python = ">=3.14,<3.15"
license = "LicenseRef-Nexus-Community-1.0"
license-files = ["LICENSE"]
dynamic = ["dependencies"]

[project.scripts]
nexus-personal-install = "nexus_personal.install:main"
nexus-personal-process = "nexus_personal.processes:main"
nexus-personal-manage = "nexus_personal.manage:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["apps", "apps.*", "nexus_personal", "nexus_personal.*"]
namespaces = true

[tool.setuptools.dynamic]
dependencies = {file = "requirements.in"}
