<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexus · Private file</title>
<style nonce="__NONCE__">*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#182434;font:16px system-ui;display:grid;min-height:100vh;place-items:center}main{width:min(92vw,520px);background:white;border:1px solid #e4e9f0;border-radius:24px;padding:36px;box-shadow:0 14px 50px #25334b0b}small{color:#66758a;letter-spacing:.12em}h1{font-size:25px;overflow-wrap:anywhere;margin:20px 0 12px}p{line-height:1.6;color:#66758a}a,button{display:inline-block;background:#1e55e8;color:white;border:0;border-radius:10px;padding:13px 22px;font:inherit;text-decoration:none;cursor:pointer}input{margin:12px 0;max-width:100%}progress{width:100%;accent-color:#1e55e8}code{font-size:11px;overflow-wrap:anywhere;color:#66758a}[hidden]{display:none}</style>
<main><small>NEXUS · PRIVATE FILE</small><h1 id="name">Opening secure link…</h1><p id="status">Verifying file access.</p><a id="download" hidden>Download file</a><input id="pick" type="file" hidden><button id="upload" hidden>Upload / resume</button><progress id="progress" max="1" value="0" hidden></progress><p><code id="sha"></code></p></main>
<script nonce="__NONCE__">
const $=id=>document.getElementById(id);let info;
async function run(){let ticket=new URLSearchParams(location.hash.slice(1)).get('ticket');history.replaceState(null,'',location.pathname);if(ticket){let r=await fetch('redeem/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ticket})});if(!r.ok)throw Error('This link expired or was already used. Request a fresh link through MCP.');let b=await r.json();info=b.data??b;sessionStorage.setItem(location.pathname,JSON.stringify(info));}else info=JSON.parse(sessionStorage.getItem(location.pathname)||'null');if(!info)throw Error('Open the complete link returned by MCP.');let h=await fetch(info.url,{method:'HEAD'});if(!h.ok)throw Error('Access expired or was revoked. Request a fresh link through MCP.');$('name').textContent=info.name;$('sha').textContent='SHA256 '+info.sha256;$('status').textContent=(info.size_bytes/1024/1024).toFixed(1)+' MiB · Private access · Resume supported';if(info.mode==='download'){$('download').href=info.url;$('download').hidden=false;}else{$('pick').hidden=$('upload').hidden=$('progress').hidden=false;}}
$('upload').onclick=async()=>{try{let file=$('pick').files[0];if(!file||file.size!==info.size_bytes)throw Error('Choose the original file with the declared size.');$('upload').disabled=true;let h=await fetch(info.url,{method:'HEAD'});if(!h.ok)throw Error('Access expired. Request a new upload link.');let offset=Number(h.headers.get('X-Nexus-Upload-Offset'));while(offset<file.size){let bytes=await file.slice(offset,offset+info.chunk_bytes).arrayBuffer();let sha=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes)),v=>v.toString(16).padStart(2,'0')).join('');let r=await fetch(info.url,{method:'PUT',headers:{'Content-Type':'application/octet-stream','X-Nexus-Upload-Offset':String(offset),'X-Nexus-Chunk-SHA256':sha},body:bytes});if(!r.ok)throw Error('Upload interrupted. Click Upload / resume to continue.');let b=await r.json();offset=(b.data??b).offset;$('progress').value=offset/file.size;$('status').textContent=Math.round(100*offset/file.size)+'% uploaded';}$('status').textContent='Uploaded. Return to MCP to validate and finalize the model.';}catch(e){$('status').textContent=e.message;}finally{$('upload').disabled=false;}};
run().catch(e=>{$('name').textContent='File access unavailable';$('status').textContent=e.message;});
</script></html>
