<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wave viewer · Nexus</title>
<style nonce="__NONCE__">
:root{color-scheme:dark;font:14px system-ui,sans-serif;background:#111318;color:#e6e9f0}*{box-sizing:border-box}body{margin:0;height:100dvh;display:flex;flex-direction:column}header{padding:16px 22px;display:flex;align-items:center;gap:16px;border-bottom:1px solid #30343e}h1{font-size:17px;margin:0;font-weight:600}#status{color:#aab4c8;font-size:12px;margin-left:auto}#downloads{display:flex;gap:12px}a{color:#98bbff;text-decoration:none;font-size:12px}main{display:flex;flex:1;min-height:0;gap:1px;background:#30343e}section{flex:1;min-width:0;background:#171b22;display:flex;flex-direction:column}h2{font-size:12px;font-weight:500;margin:0;padding:9px 16px;color:#aab4c8}iframe{flex:1;border:0;width:100%;min-height:260px}#note{padding:12px 22px;white-space:pre-wrap;color:#b9c4d7;margin:0;font-size:13px}#note:empty{display:none}.empty{margin:auto;padding:32px;max-width:640px;line-height:1.6;color:#b9c4d7}@media(max-width:800px){main{flex-direction:column}header{flex-wrap:wrap}#status{margin-left:0}}
</style></head><body><header><h1>Wave viewer</h1><nav id="downloads"></nav><span id="status">Opening secure view…</span></header><main id="panels"><p class="empty">Preparing waveform…</p></main><p id="note"></p>
<script nonce="__NONCE__">
const base=location.pathname, status=document.querySelector('#status'), panels=document.querySelector('#panels'), downloads=document.querySelector('#downloads');
let events,lastRevision=0,frames=[],loaded=new Set();
async function api(path,body){const r=await fetch(base+path,{method:body?'POST':'GET',credentials:'same-origin',headers:{'Content-Type':'application/json','X-Nexus-Wave':'1'},body:body?JSON.stringify(body):undefined});const value=await r.json();if(!r.ok)throw Error(value.detail||value.error?.message||'View unavailable. Open a fresh link through MCP.');return value.data??value}
function report(state){api('state/',{status:state}).catch(()=>{})}
function render(data){if(data.revision===lastRevision)return;lastRevision=data.revision;loaded.clear();frames=[];panels.replaceChildren();downloads.replaceChildren();document.querySelector('#note').textContent=data.snapshot.annotation;status.textContent='Loading waveforms…';report('loading');data.snapshot.panels.forEach((panel,i)=>{const section=document.createElement('section'),heading=document.createElement('h2'),frame=document.createElement('iframe'),link=document.createElement('a');heading.textContent=panel.label||'Waveform '+(i+1);frame.title=heading.textContent;const url=new URL(base+'canvas/',location.origin);url.searchParams.set('load_url',new URL(data.files[i],location.origin).href);url.searchParams.set('startup_commands',panel.commands);frame.src=url.href;frames.push(frame);section.append(heading,frame);panels.append(section);link.href=data.files[i];link.textContent='Download '+(data.snapshot.panels.length>1?String(i+1):'FST');downloads.append(link)});}
function fail(message){events?.close();panels.replaceChildren();downloads.replaceChildren();const p=document.createElement('p');p.className='empty';p.textContent=message;panels.append(p);status.textContent='View unavailable'}
window.addEventListener('message',e=>{if(e.origin!==location.origin||!frames.some(f=>f.contentWindow===e.source))return;if(e.data?.type==='wave-ready'){loaded.add(e.source);if(loaded.size===frames.length){status.textContent='Live · updates from MCP';report('ready')}}else if(e.data?.type==='wave-error'){status.textContent='Waveform failed to load';report('error')}});
(async()=>{const ticket=new URLSearchParams(location.hash.slice(1)).get('ticket');history.replaceState(null,'',base);if(ticket)await api('redeem/',{ticket});render(await api('state/'));events=new EventSource(base+'events/');events.addEventListener('state',e=>render(JSON.parse(e.data)));events.addEventListener('closed',()=>fail('This view has been closed or expired. Open a new view through MCP.'));events.onerror=()=>{status.textContent='Reconnecting…'};events.onopen=()=>{if(loaded.size===frames.length)status.textContent='Live · updates from MCP'}})().catch(e=>fail(e.message));
</script></body></html>
