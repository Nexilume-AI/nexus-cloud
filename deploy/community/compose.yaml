name: nexus-community

x-environment: &environment
  NEXUS_ORIGIN: ${NEXUS_ORIGIN:-http://127.0.0.1:18090}
  NEXUS_OWNER_EMAIL: ${NEXUS_OWNER_EMAIL:-owner@example.local}

x-service: &service
  image: ${NEXUS_COMMUNITY_IMAGE:-nexus-community:local}
  user: "10001:10001"
  init: true
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=256m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  environment: *environment
  volumes:
    - community-state:/var/lib/nexus
  network_mode: service:postgres
  depends_on:
    initialize:
      condition: service_completed_successfully
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

services:
  prepare:
    image: ${NEXUS_COMMUNITY_IMAGE:-nexus-community:local}
    build:
      context: ../..
      dockerfile: deploy/community/Dockerfile
    user: "0:0"
    command: [prepare]
    environment: *environment
    network_mode: none
    volumes:
      - community-state:/var/lib/nexus
      - bootstrap:/var/lib/nexus-bootstrap
    restart: "no"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    command: [postgres, -c, "listen_addresses=127.0.0.1", -c, "log_min_error_statement=panic", -c, "log_parameter_max_length_on_error=0"]
    environment:
      POSTGRES_DB: nexus_personal_compose
      POSTGRES_USER: nexus_community
      POSTGRES_PASSWORD_FILE: /var/lib/nexus-bootstrap/database-password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - bootstrap:/var/lib/nexus-bootstrap:ro
    # Sole network namespace; all other service ports remain loopback-only.
    ports:
      - "127.0.0.1:${NEXUS_PORT:-18090}:8080"
    depends_on:
      prepare: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, nexus_community, -d, nexus_personal_compose]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    network_mode: service:postgres
    command: [redis-server, --bind, 127.0.0.1, --appendonly, "yes"]
    volumes: [redis-data:/data]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 30

  initialize:
    <<: *service
    command: [initialize]
    restart: "no"
    volumes:
      - community-state:/var/lib/nexus
      - bootstrap:/var/lib/nexus-bootstrap:ro
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  web:
    <<: *service
    command: [web]
    healthcheck:
      test: [CMD, python, -m, nexus_personal.container, status]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 5

  worker:
    <<: *service
    command: [worker]

  agent-worker:
    <<: *service
    command: [agent-worker]

  beat:
    <<: *service
    command: [beat]

  gateway:
    image: nginx:stable-alpine
    restart: unless-stopped
    network_mode: service:postgres
    environment:
      NEXUS_BACKEND_PORT: ${NEXUS_PORT:-18090}
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      web: {condition: service_healthy}

volumes:
  community-state:
  bootstrap:
  postgres-data:
  redis-data:
