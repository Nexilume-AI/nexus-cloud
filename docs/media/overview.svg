<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
<title id="title">Nexus Cloud workflow</title>
<desc id="desc">Deploy an Agent. Python application. Configured execution runtime Then: Open Private Display. Messages and Run progress. Plans, questions and outputs Then: Use your devices. Computer or Android Runtime. Explicit pairing and scopes. This is a workflow illustration, not a product screenshot.</desc>
